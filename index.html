<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>سيريتل — مركز خدمة العملاء</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'Cairo', sans-serif; }
body { height: 100vh; overflow: hidden; background: #090e14; color: #e8eefb; user-select: none; }

/* شاشة المكتب الأساسية */
#office { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle at center, #1a2b3d, #05080d); transition: filter 1s ease, opacity 1s ease; }
#office.blurred { filter: blur(8px) brightness(0.5); pointer-events: none; }

.desk-layout { position: relative; width: 1200px; height: 700px; max-width: 95vw; max-height: 90vh; display: flex; justify-content: space-between; align-items: flex-end; padding: 40px; perspective: 1000px; }

/* تصميم شاشة الكمبيوتر على المكتب */
.pc-monitor { width: 60%; height: 55%; background: #000; border-radius: 12px; border: 8px solid #1f2937; box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,255,255,0.1); position: relative; transform: rotateY(10deg) rotateX(5deg); cursor: pointer; transition: transform 0.3s; display: flex; justify-content: center; align-items: center; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><text x="50" y="50" fill="rgba(255,255,255,0.05)" font-size="20">Syriatel CRM</text></svg>') center; }
.pc-monitor:hover { transform: rotateY(5deg) rotateX(2deg) scale(1.02); }
.pc-monitor::after { content: 'اضغط لفتح الكمبيوتر'; color: #4fd1c5; font-weight: 800; font-size: 20px; text-shadow: 0 0 10px #4fd1c5; }

/* تصميم الهاتف على المكتب */
.desk-phone { width: 200px; height: 350px; background: #111; border-radius: 30px; border: 4px solid #333; box-shadow: 0 15px 40px rgba(0,0,0,0.8); position: relative; transform: rotateY(-15deg) rotateX(10deg); cursor: pointer; transition: transform 0.3s; display: flex; justify-content: center; align-items: center; }
.desk-phone:hover { transform: rotateY(-5deg) rotateX(5deg) scale(1.05); }
.desk-phone::after { content: 'اضغط لفتح الهاتف'; color: #3b82f6; font-weight: 800; font-size: 14px; }

/* زر البداية */
#start-screen { position: absolute; left: 50px; top: 50%; transform: translateY(-50%); z-index: 50; display: flex; flex-direction: column; gap: 15px; transition: opacity 0.5s ease, transform 0.5s ease; }
#start-screen.hide { opacity: 0; transform: translateY(-50%) translateX(-50px); pointer-events: none; }
#start-btn { padding: 15px 40px; background: linear-gradient(135deg, #10b981, #059669); color: #fff; font-size: 24px; font-weight: 900; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 10px 30px rgba(16,185,129,0.4); transition: 0.2s; }
#start-btn:hover { transform: scale(1.05); box-shadow: 0 15px 40px rgba(16,185,129,0.6); }

/* الشاشات المكبرة (الهاتف والكمبيوتر) */
.overlay-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 100; }
.overlay-screen.active { display: flex; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* واجهة الكمبيوتر المكبرة */
.pc-full { width: 90vw; max-width: 900px; height: 85vh; max-height: 650px; background: #0f172a; border-radius: 16px; border: 1px solid #1e293b; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.9); }
.pc-header { background: #1e293b; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
.pc-header h2 { color: #38bdf8; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.pc-header .status { color: #94a3b8; font-size: 12px; }
.pc-body { display: flex; flex: 1; overflow: hidden; }
.pc-tools { width: 35%; background: #0f172a; border-left: 1px solid #1e293b; padding: 15px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
.pc-tools h3 { color: #64748b; font-size: 12px; margin-bottom: 5px; }
.pc-tool-btn { padding: 12px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-size: 13px; text-align: right; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; }
.pc-tool-btn:hover { background: #334155; border-color: #38bdf8; }
.pc-tool-btn.done { border-color: #10b981; background: rgba(16,185,129,0.1); color: #10b981; }
.pc-chat { flex: 1; display: flex; flex-direction: column; background: #020617; }
.chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 80%; padding: 10px 15px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
.msg.cust { background: #1e293b; align-self: flex-start; border-top-left-radius: 4px; }
.msg.agent { background: #059669; align-self: flex-end; border-top-right-radius: 4px; }
.msg.sys { align-self: center; background: transparent; border: 1px dashed #334155; color: #10b981; font-size: 12px; }
.chat-input { padding: 15px; background: #0f172a; border-top: 1px solid #1e293b; display: flex; gap: 10px; }
.chat-input input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #020617; color: #fff; outline: none; }
.chat-input button { padding: 0 20px; background: #10b981; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
.close-btn { background: #ef4444; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }

/* واجهة الهاتف المكبرة (شكل آيفون) */
.iphone-frame { width: 380px; height: 780px; max-height: 90vh; max-width: 95vw; background: #000; border-radius: 50px; border: 12px solid #1f2937; position: relative; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 0 2px #000, 0 30px 80px rgba(0,0,0,0.9); }
.iphone-notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 150px; height: 35px; background: #000; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; z-index: 10; }
.iphone-screen { flex: 1; background: linear-gradient(180deg, #0f172a, #020617); display: flex; flex-direction: column; position: relative; }
.iphone-status-bar { height: 50px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 25px 5px; font-size: 12px; font-weight: bold; color: #fff; }
.iphone-content { flex: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; }
.incoming-call { display: flex; flex-direction: column; align-items: center; gap: 20px; animation: slideUp 0.5s ease; }
@keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.caller-avatar { width: 120px; height: 120px; border-radius: 50%; background: #1e293b; border: 4px solid #38bdf8; display: flex; justify-content: center; align-items: center; font-size: 40px; margin-bottom: 10px; }
.caller-name { font-size: 28px; font-weight: 900; color: #fff; }
.caller-number { font-size: 14px; color: #94a3b8; }
.call-actions { display: flex; justify-content: space-around; width: 100%; margin-top: 40px; }
.btn-call { width: 70px; height: 70px; border-radius: 50%; border: none; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 24px; transition: 0.2s; }
.btn-answer { background: #10b981; color: #fff; box-shadow: 0 10px 20px rgba(16,185,129,0.4); }
.btn-hang { background: #ef4444; color: #fff; box-shadow: 0 10px 20px rgba(239,68,68,0.4); }
.btn-call:hover { transform: scale(1.1); }

/* التبويبات داخل الهاتف */
.phone-tabs { display: flex; border-top: 1px solid #1e293b; background: #0f172a; padding: 10px 0; }
.phone-tab { flex: 1; text-align: center; color: #64748b; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; }
.phone-tab.active { color: #38bdf8; }
.phone-tab svg { width: 24px; height: 24px; fill: currentColor; }

/* المودال */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 200; backdrop-filter: blur(5px); }
.modal-overlay.active { display: flex; }
.modal-content { background: #1e293b; padding: 25px; border-radius: 16px; width: 350px; max-width: 90vw; border: 1px solid #334155; }
.modal-content h3 { margin-bottom: 15px; color: #38bdf8; }
.modal-content input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none; }
.modal-content .actions { display: flex; gap: 10px; }
.modal-content button { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
.btn-confirm { background: #10b981; color: #fff; }
.btn-cancel { background: #475569; color: #fff; }

/* توست */
#toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 12px 24px; border-radius: 30px; border: 1px solid #38bdf8; display: none; z-index: 300; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
#toast.show { display: block; animation: fadeIn 0.3s ease; }

</style>
</head>
<body>

<!-- المكتب الأساسي -->
<div id="office">
  <div class="desk-layout">
    <!-- زر البداية -->
    <div id="start-screen">
      <button id="start-btn">ابدأ الدوام</button>
    </div>
    
    <!-- الكمبيوتر على المكتب -->
    <div class="pc-monitor" id="pc-monitor" onclick="openPC()"></div>
    
    <!-- الهاتف على المكتب -->
    <div class="desk-phone" id="desk-phone" onclick="openPhone()"></div>
  </div>
</div>

<!-- شاشة الكمبيوتر المكبرة -->
<div class="overlay-screen" id="pc-screen">
  <div class="pc-full">
    <div class="pc-header">
      <h2>🖥️ Syriatel CRM</h2>
      <span class="status" id="pc-status">في انتظار العميل...</span>
      <button class="close-btn" onclick="closePC()">إغلاق</button>
    </div>
    <div class="pc-body">
      <div class="pc-tools" id="pc-tools">
        <h3>أدوات النظام</h3>
        <!-- سيتم توليد الأزرار هنا -->
      </div>
      <div class="pc-chat">
        <div class="chat-messages" id="chat-messages">
          <div class="msg sys">مرحباً بك. ابدأ باستقبال المكالمات من الهاتف.</div>
        </div>
        <div class="chat-input">
          <input type="text" id="chat-input-field" placeholder="اكتب ردك هنا..." onkeypress="handleEnter(event)">
          <button onclick="sendMessage()">إرسال</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- شاشة الهاتف المكبرة -->
<div class="overlay-screen" id="phone-screen">
  <div class="iphone-frame">
    <div class="iphone-notch"></div>
    <div class="iphone-screen">
      <div class="iphone-status-bar">
        <span id="phone-time">9:41</span>
        <span>📶 🔋</span>
      </div>
      <div class="iphone-content" id="phone-content">
        <!-- محتوى الهاتف يتغير هنا -->
        <div class="msg sys">لا توجد مكالمات حالياً...</div>
      </div>
      <div class="phone-tabs">
        <div class="phone-tab active" onclick="switchTab('calls')">
          <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
          المكالمات
        </div>
        <div class="phone-tab" onclick="switchTab('info')">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
          معلومات الزبون
        </div>
      </div>
    </div>
  </div>
</div>

<!-- المودال -->
<div class="modal-overlay" id="modal">
  <div class="modal-content">
    <h3 id="modal-title">إجراء</h3>
    <div id="modal-inputs"></div>
    <div class="actions">
      <button class="btn-confirm" onclick="submitModal()">تنفيذ</button>
      <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<!-- توست -->
<div id="toast">رسالة</div>

<script>
// ==========================================
// 1. إدارة الحالة (State Management)
// ==========================================
const state = {
  phase: 'start', // start, waiting, ringing, active
  customer: null,
  chatHistory: [],
  satisfaction: 60,
  doneTools: [],
  aiKey: null,
  timeouts: [],
  ringInterval: null,
  activeTab: 'calls',
  isPCBlur: true
};

// ==========================================
// 2. البيانات (الزبائن، المشاكل، الأدوات)
// ==========================================
const NAMES = ['أحمد','ليلى','سمير','رنا','خالد','نور','مازن','سلمى','فادي','هبة'];
const PROBLEMS = [
  { id: 'recharge', title: 'شحن رصيد', steps: ['lookup', 'recharge'], data: () => ({ amount: pick([5000, 10000, 15000]) }), intro: c => `ألو؟ أنا ${c.name}. بدي اشحن رصيدي بـ ${c.data.amount} ليرة.`, isScam: false },
  { id: 'transfer', title: 'تحويل رصيد', steps: ['lookup', 'transfer'], data: () => ({ amount: pick([2000, 5000]), recipient: '09' + rnd(10000000, 99999999) }), intro: c => `مرحبا، معك ${c.name}. بدي حوّل ${c.data.amount} ليرة لرقم ${c.data.recipient}.`, isScam: false },
  { id: 'scam_lost', title: 'سرقة رصيد (نصب)', steps: ['ticket'], data: () => ({}), intro: c => `ألو! ${c.name} معك. انسرق رصيدي كله! بدي تعويض فوري 50 ألف ليرة هلأ!`, isScam: true, scamReact: () => 'شو يعني تذكرة؟! أنا بدي مصاري هلأ! إنت نصاب!' },
  { id: 'scam_net', title: 'انقطاع شبكة (نصب)', steps: ['ticket'], data: () => ({}), intro: c => `مرحبا، أنا ${c.name}. الشبكة مقطوعة من يومين وأنا بشتغل عالنت. بدي تعويضي بباقة مجانية شهر!`, isScam: true, scamReact: () => 'ليش لأ؟ أنا خسرت شغلي! بدي باقة مجانية!' },
  { id: 'slow', title: 'الإنترنت بطيء', steps: ['linecheck', 'restart'], data: () => ({}), intro: c => `الإنترنت عندي بطيء، أنا ${c.name}. شو القصة؟`, isScam: false }
];

const TOOLS = [
  { id: 'lookup', name: 'التحقق من الحساب', icon: '🔍' },
  { id: 'linecheck', name: 'فحص حالة الخط', icon: '📶' },
  { id: 'recharge', name: 'شحن رصيد', icon: '💳', fields: [{ key: 'amount', label: 'المبلغ', type: 'number' }] },
  { id: 'transfer', name: 'تحويل رصيد', icon: '🔁', fields: [{ key: 'recipient', label: 'رقم المستلم', type: 'text' }, { key: 'amount', label: 'المبلغ', type: 'number' }] },
  { id: 'ticket', name: 'فتح تذكرة فنية', icon: '🎫' },
  { id: 'restart', name: 'إعادة تشغيل الخدمة', icon: '🔄' }
];

// ==========================================
// 3. الدوال المساعدة
// ==========================================
const $ = s => document.querySelector(s);
const pick = a => a[Math.floor(Math.random() * a.length)];
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const sleep = ms => new Promise(r => setTimeout(r, ms));

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t.timer); t.timer = setTimeout(() => t.classList.remove('show'), 3000);
}

// أصوات
let AC = null;
function playSound(type) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    if (type === 'ring') {
      o.frequency.value = 1000; g.gain.value = 0.1; o.start();
      setTimeout(() => { o.frequency.value = 1200; }, 150);
      setTimeout(() => { o.stop(); }, 300);
    } else if (type === 'click') {
      o.frequency.value = 800; g.gain.value = 0.05; o.start(); o.stop(AC.currentTime + 0.05);
    } else if (type === 'success') {
      o.frequency.value = 1000; g.gain.value = 0.1; o.start();
      setTimeout(() => { o.frequency.value = 1500; }, 100);
      setTimeout(() => { o.stop(); }, 250);
    } else if (type === 'error') {
      o.frequency.value = 300; o.type = 'sawtooth'; g.gain.value = 0.1; o.start(); o.stop(AC.currentTime + 0.2);
    }
  } catch (e) {}
}

// النطق (TTS)
let voices = [];
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = () => { voices = speechSynthesis.getVoices(); };
  voices = speechSynthesis.getVoices();
}
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const ar = voices.find(v => v.lang.startsWith('ar'));
  if (ar) u.voice = ar;
  u.lang = 'ar-SA'; u.rate = 0.95; u.pitch = 1;
  speechSynthesis.speak(u);
}

// ==========================================
// 4. واجهة المستخدم والتفاعل
// ==========================================
function initGame() {
  $('#start-screen').classList.add('hide');
  $('#office').classList.remove('blurred');
  state.phase = 'waiting';
  $('#pc-status').textContent = 'في انتظار العميل...';
  updateUI();
  
  // جدولة أول مكالمة
  scheduleCall(rnd(3000, 6000));
}

function scheduleCall(delay) {
  const t = setTimeout(() => {
    if (state.phase === 'waiting') startCall();
    else if (state.phase === 'active') {
      // إذا كان مشغول، نعيد الجدولة
      scheduleCall(10000);
    }
  }, delay);
  state.timeouts.push(t);
}

function startCall() {
  state.phase = 'ringing';
  state.customer = generateCustomer();
  state.chatHistory = [];
  state.doneTools = [];
  state.satisfaction = 60;
  
  playSound('ring');
  state.ringInterval = setInterval(() => playSound('ring'), 1500);
  
  // تحديث واجهة الهاتف
  updatePhoneUI();
  
  // إذا كان الكمبيوتر مفتوح، نحدثه
  if (!$('#pc-screen').classList.contains('active')) {
    toast('📞 مكالمة واردة! افتح الهاتف للرد.');
  }
}

function answerCall() {
  if (state.phase !== 'ringing') return;
  clearInterval(state.ringInterval);
  state.phase = 'active';
  playSound('click');
  
  updatePhoneUI();
  updatePCUI();
  
  // إضافة رسالة ترحيب
  addMessage('sys', '📞 تم الرد على المكالمة');
  setTimeout(() => {
    addMessage('customer', state.customer.intro);
    speak(state.customer.intro);
  }, 800);
}

function generateCustomer() {
  const p = pick(PROBLEMS);
  const c = {
    name: pick(NAMES),
    number: '09' + rnd(10000000, 99999999),
    problem: p,
    data: p.data(),
    revealed: false,
    look: { skin: pick(['#f3cba6','#e6b183','#d19a6a']), shirt: pick(['#2b5d8a','#3a6b4f']), bg: pick(['#1b3a5c','#1d4a3c']) }
  };
  c.intro = p.intro(c);
  return c;
}

// ==========================================
// 5. تحديث الواجهات
// ==========================================
function updateUI() {
  updatePhoneUI();
  updatePCUI();
}

function updatePhoneUI() {
  const container = $('#phone-content');
  if (state.phase === 'ringing') {
    container.innerHTML = `
      <div class="incoming-call">
        <div class="caller-avatar">👤</div>
        <div class="caller-name">${state.customer.name}</div>
        <div class="caller-number">رقم مجهول</div>
        <div class="call-actions">
          <button class="btn-call btn-hang" onclick="endCall(true)">✖</button>
          <button class="btn-call btn-answer" onclick="answerCall()">📞</button>
        </div>
      </div>
    `;
  } else if (state.phase === 'active') {
    if (state.activeTab === 'calls') {
      container.innerHTML = `
        <div style="width:100%; display:flex; flex-direction:column; gap:15px;">
          <div style="text-align:center; margin-bottom:20px;">
            <div class="caller-avatar" style="margin:0 auto; width:80px; height:80px; font-size:30px;">👤</div>
            <h3 style="margin-top:10px; color:#fff;">${state.customer.name}</h3>
            <p style="color:#10b981; font-size:12px; margin-top:5px;">● متصل</p>
          </div>
          <div style="background:#1e293b; border-radius:12px; padding:15px; font-size:14px; line-height:1.6; color:#cbd5e1;">
            ${state.chatHistory.length > 0 ? state.chatHistory[state.chatHistory.length-1].text : '...'}
          </div>
          <button class="btn-call btn-hang" style="width:100%; border-radius:12px; height:50px; margin-top:20px;" onclick="endCall(false)">إنهاء المكالمة</button>
        </div>
      `;
    } else {
      // تبويب المعلومات
      container.innerHTML = `
        <div style="width:100%; text-align:right; color:#cbd5e1; padding:10px;">
          <h3 style="color:#38bdf8; margin-bottom:20px; border-bottom:1px solid #334155; padding-bottom:10px;">بيانات المشترك</h3>
          <p style="margin-bottom:10px;"><strong>الاسم:</strong> ${state.customer.name}</p>
          <p style="margin-bottom:10px;"><strong>الرقم:</strong> ${state.customer.revealed ? state.customer.number : '**********'}</p>
          <p style="margin-bottom:10px;"><strong>المشكلة:</strong> ${state.customer.problem.title}</p>
          <p style="margin-bottom:10px;"><strong>نوع المشكلة:</strong> ${state.customer.problem.isScam ? '⚠️ مشبوهة' : '✅ عادية'}</p>
          <p style="margin-bottom:10px;"><strong>الرضا:</strong> ${state.satisfaction}%</p>
        </div>
      `;
    }
  } else {
    container.innerHTML = `<div class="msg sys" style="color:#64748b;">لا توجد مكالمات حالياً...</div>`;
  }
}

function updatePCUI() {
  // تحديث الأدوات
  const toolsContainer = $('#pc-tools');
  toolsContainer.innerHTML = '<h3>أدوات النظام</h3>';
  TOOLS.forEach(tool => {
    const btn = document.createElement('button');
    btn.className = 'pc-tool-btn';
    if (state.doneTools.includes(tool.id)) btn.classList.add('done');
    btn.innerHTML = `<span>${tool.icon}</span> <span>${tool.name}</span>`;
    btn.onclick = () => handleToolClick(tool);
    btn.disabled = state.phase !== 'active' || !state.customer.revealed;
    if (btn.disabled) btn.style.opacity = '0.5';
    toolsContainer.appendChild(btn);
  });

  // تحديث الدردشة
  const chat = $('#chat-messages');
  chat.innerHTML = '';
  if (state.phase !== 'active') {
    chat.innerHTML = '<div class="msg sys">لا توجد مكالمة نشطة. ارد على الهاتف أولاً.</div>';
    return;
  }
  
  state.chatHistory.forEach(msg => {
    const div = document.createElement('div');
    div.className = `msg ${msg.role === 'customer' ? 'cust' : msg.role === 'agent' ? 'agent' : 'sys'}`;
    div.textContent = msg.text;
    chat.appendChild(div);
  });
  chat.scrollTop = chat.scrollHeight;
  $('#pc-status').textContent = `متصل مع: ${state.customer.name} | الرضا: ${state.satisfaction}%`;
}

function addMessage(role, text) {
  state.chatHistory.push({ role, text });
  if (role === 'customer') speak(text);
  updatePCUI();
  updatePhoneUI();
}

// ==========================================
// 6. الشاشات المنبثقة (الهاتف والكمبيوتر)
// ==========================================
function openPC() {
  if (!state.customer && state.phase === 'waiting') {
    toast('لا توجد مكالمة نشطة حالياً. انتظر اتصال الزبون.');
  }
  $('#pc-screen').classList.add('active');
  $('#office').classList.add('blurred');
  updatePCUI();
}

function closePC() {
  $('#pc-screen').classList.remove('active');
  if (!$('#phone-screen').classList.contains('active')) {
    $('#office').classList.remove('blurred');
  }
}

function openPhone() {
  $('#phone-screen').classList.add('active');
  $('#office').classList.add('blurred');
  updatePhoneUI();
}

function closePhone() {
  $('#phone-screen').classList.remove('active');
  if (!$('#pc-screen').classList.contains('active')) {
    $('#office').classList.remove('blurred');
  }
}

function switchTab(tab) {
  state.activeTab = tab;
  document.querySelectorAll('.phone-tab').forEach(t => t.classList.remove('active'));
  event.target.closest('.phone-tab').classList.add('active');
  updatePhoneUI();
}

// ==========================================
// 7. أدوات الكمبيوتر
// ==========================================
function handleToolClick(tool) {
  if (!state.customer) return;
  playSound('click');
  
  if (tool.fields) {
    // فتح مودال
    $('#modal-title').textContent = tool.name;
    const inputs = $('#modal-inputs'); inputs.innerHTML = '';
    tool.fields.forEach(f => {
      inputs.innerHTML += `<label style="display:block; margin-bottom:5px; color:#94a3b8; font-size:12px;">${f.label}</label>
                           <input type="${f.type}" id="input-${f.key}" placeholder="${f.label}">`;
    });
    $('#modal').classList.add('active');
    window.currentTool = tool;
  } else {
    // تنفيذ مباشر
    executeTool(tool.id, {});
  }
}

function submitModal() {
  const tool = window.currentTool;
  const vals = {};
  tool.fields.forEach(f => {
    vals[f.key] = document.getElementById(`input-${f.key}`).value.trim();
  });
  closeModal();
  executeTool(tool.id, vals);
}

function closeModal() {
  $('#modal').classList.remove('active');
  window.currentTool = null;
}

function executeTool(toolId, params) {
  const c = state.customer;
  
  // إذا ما سأل عن الرقم
  if (!c.revealed) {
    toast('⚠️ يجب أن تسأل الزبون عن رقمه أولاً!');
    playSound('error');
    return;
  }
  
  // هل الأداة مفيدة لهذه المشكلة؟
  if (!c.problem.steps.includes(toolId)) {
    toast('❌ هذا الإجراء غير مفيد للمشكلة الحالية');
    playSound('error');
    state.satisfaction -= 5;
    addMessage('sys', '⚠️ محاولة إجراء غير مفيد');
    return;
  }
  
  if (state.doneTools.includes(toolId)) {
    toast('تم تنفيذ هذا الإجراء مسبقاً');
    return;
  }
  
  // التحقق من المدخلات
  if (toolId === 'recharge' && Number(params.amount) !== c.data.amount) {
    toast('❌ المبلغ غير مطابق لما طلبه الزبون!'); playSound('error'); return;
  }
  if (toolId === 'transfer' && (Number(params.amount) !== c.data.amount || params.recipient !== c.data.recipient)) {
    toast('❌ بيانات التحويل غير صحيحة!'); playSound('error'); return;
  }

  // نجاح الإجراء
  state.doneTools.push(toolId);
  state.satisfaction = Math.min(100, state.satisfaction + 15);
  playSound('success');
  addMessage('sys', `✅ تم تنفيذ: ${TOOLS.find(t => t.id === toolId).name}`);
  updatePCUI();

  // هل اكتملت الخطوات؟
  if (c.problem.steps.every(s => state.doneTools.includes(s))) {
    setTimeout(() => {
      addMessage('sys', '🎉 تم حل المشكلة بالكامل!');
      if (c.problem.isScam) {
        addMessage('customer', c.problem.scamReact());
      } else {
        addMessage('customer', 'شكراً كتير! الله يعطيك العافية، انحلت المشكلة.');
      }
      setTimeout(() => endCall(false), 3000);
    }, 1000);
  } else {
    addMessage('customer', pick(['طيب... وبعدين؟', 'شو الخطوة التانية؟', 'أنا مستعجل شوي.']));
  }
}

// ==========================================
// 8. الدردشة (الرسائل)
// ==========================================
async function sendMessage() {
  const input = $('#chat-input-field');
  const text = input.value.trim();
  if (!text || state.phase !== 'active') return;
  
  input.value = '';
  addMessage('agent', text);
  playSound('click');
  
  // التحقق من طلب الرقم
  if (text.includes('رقم') || text.includes('نمرة') || text.includes('حسابك')) {
    state.customer.revealed = true;
    addMessage('customer', `أكيد، رقمي هو ${state.customer.number}`);
    updatePCUI();
    return;
  }
  
  // إذا كان الزبون نصاب
  if (state.customer.problem.isScam && text.includes('تعويض')) {
    addMessage('customer', 'إنت نصاب! ما رح تعطيني شي! بدي مديرك!');
    state.satisfaction -= 20;
    return;
  }

  // محرك ذكاء اصطناعي محلي بسيط للردود
  await sleep(800);
  let reply = '';
  if (state.customer.problem.isScam) {
    reply = pick(['أنا بدي حقي هلأ!', 'ليش عم تماطلني؟', 'إذا ما عوضتوني بروح عالشرطة!']);
  } else {
    reply = pick(['طيب، وين وصلنا؟', 'فهمت، بس أنا بدي حل.', 'يا ريت تعجل شوي.']);
  }
  addMessage('customer', reply);
}

function handleEnter(e) {
  if (e.key === 'Enter') sendMessage();
}

// ==========================================
// 9. إنهاء المكالمة
// ==========================================
function endCall(abandoned) {
  if (state.phase !== 'active' && state.phase !== 'ringing') return;
  
  clearInterval(state.ringInterval);
  
  if (abandoned) {
    addMessage('sys', '📴 الزبون أغلق الخط');
  } else {
    addMessage('sys', '📴 انتهت المكالمة');
  }
  
  state.phase = 'waiting';
  state.customer = null;
  state.doneTools = [];
  state.chatHistory = [];
  
  updatePCUI();
  updatePhoneUI();
  
  // إغلاق الشاشات
  closePC();
  closePhone();
  
  // جدولة مكالمة جديدة بعد دقيقة إلى دقيقتين
  const delay = rnd(60000, 120000);
  toast('في انتظار المكالمة التالية...');
  scheduleCall(delay);
}

// ==========================================
// 10. التهيئة
// ==========================================
$('#start-btn').onclick = initGame;

// الساعة
setInterval(() => {
  const d = new Date();
  $('#phone-time').textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}, 1000);

</script>
</body>
